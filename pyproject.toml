[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-misuse-detector"
version = "0.1.0"
description = "Detect tool misuse in LLM coding agents using LLM-as-judge"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "docent-python",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "diskcache>=5.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
tool-misuse-detector = "tool_misuse_detector.cli:app"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tool_misuse_detector/cli.py" = ["B008"]

[tool.ruff.format]
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
